[project]
name = "resoursing-assistant-test"
version = "0.1.0"
description = "A local, source-grounded conversational resourcing assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dspy>=3.1,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pydantic>=2.10,<3",
  "openai>=1.68,<3",
  "tiktoken>=0.9,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy>=2.0,<2.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resourcing_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
